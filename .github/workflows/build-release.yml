name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses || true

      - name: Setup Keystore
        run: |
          mkdir -p app/keystore
          keytool -genkeypair -v \
            -keystore app/keystore/release.jks \
            -alias shark \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass shark123 \
            -keypass shark123 \
            -dname "CN=Shark, OU=Shark, O=Shark, L=City, S=State, C=US"
          printf "storeFile=keystore/release.jks\nstorePassword=shark123\nkeyAlias=shark\nkeyPassword=shark123\n" > app/keystore.properties

      - name: Grant execute permission for gradlew
        run: chmod +x app/gradlew

      - name: Build Release APK
        run: |
          cd app
          ./gradlew :app:assembleRelease --stacktrace

      - name: Prepare Release Artifacts
        id: prepare
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" != v* ]]; then
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v2.4.3")
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          APK_SRC=$(find app/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_SRC" ]; then
            echo "Error: Release APK not found!"
            exit 1
          fi

          mkdir -p dist
          APK_DEST="dist/Shark-${TAG}.apk"
          cp "$APK_SRC" "$APK_DEST"
          cd dist
          sha256sum "Shark-${TAG}.apk" > "Shark-${TAG}.apk.sha256"
          cat "Shark-${TAG}.apk.sha256"
          cd ..

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shark-${{ steps.prepare.outputs.tag }}
          path: dist/*

      - name: Upload APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.prepare.outputs.tag }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" dist/* --clobber
